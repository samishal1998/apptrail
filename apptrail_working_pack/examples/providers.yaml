providers:
  - id: docker-main
    type: docker
    endpoint: unix:///var/run/docker.sock
    watch: true

  - id: traefik-main
    type: traefik
    source: docker-labels
    docker_provider: docker-main

  - id: caddy-main
    type: caddy
    admin_api: http://127.0.0.1:2019

  - id: nginx-main
    type: nginx
    paths:
      - /etc/nginx/nginx.conf

  - id: manual-files
    type: file
    paths:
      - /etc/apptrail/apps.d
