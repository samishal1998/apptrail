services:
  apptrail:
    build:
      context: .
      args:
        APPTRAIL_VERSION: ${APPTRAIL_VERSION:-latest}
    ports:
      - "${APPTRAIL_PORT:-8080}:8080"
    volumes:
      - apptrail-data:/data
    restart: unless-stopped
    environment:
      APPTRAIL_ORIGIN: ${APPTRAIL_ORIGIN:-}
    # Docker discovery can use a restricted API proxy on a reachable network.
    # Socket access, if desired, must be mounted and granted explicitly.

volumes:
  apptrail-data:
