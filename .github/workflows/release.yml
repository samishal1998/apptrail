name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: npm ci --prefix web && npm run build --prefix web
      - name: Verify backend and installer
        run: |
          go test -race ./...
          go vet ./...
          sh -n install.sh
          bash -n scripts/release.sh
          node --test scripts/install.test.cjs
      - name: Build release archives and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/release.sh "$VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --json isDraft --jq .isDraft > /tmp/release-state; then
            [[ "$(cat /tmp/release-state)" == true ]] || { printf '%s\n' 'This release is already public; publish a new version instead.' >&2; exit 1; }
          else
            gh release create "$VERSION" --draft --verify-tag --generate-notes --title "Apptrail $VERSION"
          fi
          gh release upload "$VERSION" release-dist/* --clobber
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "$VERSION" --draft=false --latest
          fi

  container:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          printf 'tags=%s:%s\nimage=%s\n' "$image" "$VERSION" "$image" >> "$GITHUB_OUTPUT"
      - name: Publish release-backed images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: APPTRAIL_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$(docker run --rm "$IMAGE:$VERSION" --version)" == "Apptrail $VERSION" ]]
          docker run -d --name apptrail-smoke "$IMAGE:$VERSION"
          trap 'docker logs apptrail-smoke; docker rm -f apptrail-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec apptrail-smoke wget -q -O - http://127.0.0.1:8080/api/session; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Promote verified stable image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$VERSION" != *-* ]]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          fi
